name: Sync Bullinger into pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

env:
  PAGES_SUBDIR: projects/Bullinger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Bullinger repository
        uses: actions/checkout@v4
        with:
          repository: timjavins/Bullinger
          path: bullinger
          fetch-depth: 1

      - name: Mirror Bullinger into pages
        run: |
          set -euo pipefail
          rm -rf "$PAGES_SUBDIR"
          mkdir -p "$PAGES_SUBDIR"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.gitmodules' \
            bullinger/ "$PAGES_SUBDIR/"
          rm -rf "$PAGES_SUBDIR/.git"
          rm -f "$PAGES_SUBDIR/.gitmodules"

      - name: Commit and push changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Bullinger is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PAGES_SUBDIR"
          git commit -m "Sync Bullinger repository into $PAGES_SUBDIR"
          git push
